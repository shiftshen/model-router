name: Windows

on:
  push:
    branches: [main]
    tags: ["v*-windows-preview*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned SQLite CLI
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.sqlite.org/2026/sqlite-tools-win-x64-3530400.zip"
          $expected = "f46ee2475de4cbe287e6e5f7d43c838796b14e7379cd216bdbb28d391429f9fc"
          $zip = Join-Path $env:RUNNER_TEMP "sqlite-tools-win-x64-3530400.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sqlite-tools"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SQLite SHA256 mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $sqlite = Get-ChildItem $extract -Recurse -Filter sqlite3.exe | Select-Object -First 1
          if (-not $sqlite) { throw "sqlite3.exe not found in official SQLite archive" }
          New-Item -ItemType Directory -Force .runtime-cache/windows | Out-Null
          Copy-Item $sqlite.FullName .runtime-cache/windows/sqlite3.exe
          .\.runtime-cache\windows\sqlite3.exe --version
      - name: Install dependencies
        run: npm ci
      - name: Install model router engine dependencies
        run: npm ci --prefix vendor/model-router-engine --omit=dev --ignore-scripts
      - name: Node tests on Windows
        shell: powershell
        run: |
          $env:CMA_SQLITE3 = (Resolve-Path ".runtime-cache/windows/sqlite3.exe")
          $failed = @()
          Get-ChildItem tests -Filter "*.test.mjs" | Sort-Object Name | ForEach-Object {
            Write-Host ""
            Write-Host "=== Windows CI: $($_.Name) ==="
            Write-Host "::notice file=tests/$($_.Name),title=Windows test start::$($_.Name)"
            $output = @(& node --test --test-force-exit --test-timeout=45000 $_.FullName 2>&1)
            $output | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) {
              $failed += $_.Name
              $tail = (($output | Select-Object -Last 20) -join " | ").Replace("%", "%25")
              Write-Host "::error file=tests/$($_.Name),title=Windows test failed: $($_.Name)::$tail"
            }
          }
          if ($failed.Count -gt 0) {
            throw "Windows tests failed: $($failed -join ', ')"
          }
      - name: Model intelligence tests on Windows
        run: node --test model-intelligence/tests/planner.test.mjs model-intelligence/tests/laya-client.test.mjs model-intelligence/tests/decision-runtime.test.mjs
      - name: Build Windows installers
        shell: powershell
        run: |
          $env:CMA_SQLITE3 = (Resolve-Path ".runtime-cache/windows/sqlite3.exe")
          $output = @(& npm run win:dist 2>&1)
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $tail = (($output | Select-Object -Last 50) -join " | ").Replace("%", "%25")
            Write-Host "::error file=package.json,title=Windows packaging failed::$tail"
            throw "electron-builder failed"
          }
      - name: Verify artifacts and write checksums
        shell: powershell
        run: |
          Get-ChildItem release-windows
          $files = @(Get-ChildItem release-windows -Filter "*.exe")
          if ($files.Count -lt 2) { throw "Expected NSIS and portable exe artifacts" }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release-windows/SHA256SUMS-windows.txt
          Get-Content release-windows/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Model-Router-Windows-x64
          path: |
            release-windows/*.exe
            release-windows/SHA256SUMS-windows.txt
          if-no-files-found: error
      - name: Publish preview release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Model Router ${{ github.ref_name }}
          body: Windows Preview automated x64 build. Core Node tests passed on windows-latest; real Microsoft Store/MSIX desktop behavior still requires user-machine validation.
          files: |
            release-windows/*.exe
            release-windows/SHA256SUMS-windows.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
